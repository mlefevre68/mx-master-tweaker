[project]
name = "mx-master-tweaker"
version = "1.0.0"
description = "Personalise the buttons on a Logitech MX Master, entirely on your own machine"
readme = "README.md"
requires-python = ">=3.10"

# Nothing. The app is built on ctypes and tkinter, both of which are part of Python
# itself. That is the point: it has to install and run on a locked-down work laptop
# where adding packages is awkward, and it must be obvious that nothing phones home.
dependencies = []

[project.scripts]
mx-master-tweaker = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
